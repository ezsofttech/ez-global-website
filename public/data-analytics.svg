<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Disagreeing data sources reconciled into a single warehouse and one agreed report">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f9ff"/>
      <stop offset="55%" stop-color="#eaf1fe"/>
      <stop offset="100%" stop-color="#dfe9fd"/>
    </linearGradient>
    <linearGradient id="dcore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#0b64f1"/>
    </linearGradient>
    <filter id="dsoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0b3e8f" flood-opacity="0.14"/>
    </filter>
    <filter id="dglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#dbg)"/>

  <!-- dot field -->
  <g fill="#0b64f1" opacity="0.10">
    <g transform="translate(80,90)">
      <g><circle cx="0" cy="0" r="3"/><circle cx="96" cy="0" r="3"/><circle cx="192" cy="0" r="3"/><circle cx="288" cy="0" r="3"/><circle cx="384" cy="0" r="3"/><circle cx="480" cy="0" r="3"/><circle cx="576" cy="0" r="3"/><circle cx="672" cy="0" r="3"/><circle cx="768" cy="0" r="3"/><circle cx="864" cy="0" r="3"/><circle cx="960" cy="0" r="3"/><circle cx="1056" cy="0" r="3"/><circle cx="1152" cy="0" r="3"/><circle cx="1248" cy="0" r="3"/><circle cx="1344" cy="0" r="3"/><circle cx="1440" cy="0" r="3"/></g>
      <g transform="translate(0,96)"><circle cx="0" cy="0" r="3"/><circle cx="96" cy="0" r="3"/><circle cx="192" cy="0" r="3"/><circle cx="288" cy="0" r="3"/><circle cx="384" cy="0" r="3"/><circle cx="480" cy="0" r="3"/><circle cx="576" cy="0" r="3"/><circle cx="672" cy="0" r="3"/><circle cx="768" cy="0" r="3"/><circle cx="864" cy="0" r="3"/><circle cx="960" cy="0" r="3"/><circle cx="1056" cy="0" r="3"/><circle cx="1152" cy="0" r="3"/><circle cx="1248" cy="0" r="3"/><circle cx="1344" cy="0" r="3"/><circle cx="1440" cy="0" r="3"/></g>
      <g transform="translate(0,192)"><circle cx="0" cy="0" r="3"/><circle cx="96" cy="0" r="3"/><circle cx="192" cy="0" r="3"/><circle cx="288" cy="0" r="3"/><circle cx="384" cy="0" r="3"/><circle cx="480" cy="0" r="3"/><circle cx="576" cy="0" r="3"/><circle cx="672" cy="0" r="3"/><circle cx="768" cy="0" r="3"/><circle cx="864" cy="0" r="3"/><circle cx="960" cy="0" r="3"/><circle cx="1056" cy="0" r="3"/><circle cx="1152" cy="0" r="3"/><circle cx="1248" cy="0" r="3"/><circle cx="1344" cy="0" r="3"/><circle cx="1440" cy="0" r="3"/></g>
      <g transform="translate(0,288)"><circle cx="0" cy="0" r="3"/><circle cx="96" cy="0" r="3"/><circle cx="192" cy="0" r="3"/><circle cx="288" cy="0" r="3"/><circle cx="384" cy="0" r="3"/><circle cx="480" cy="0" r="3"/><circle cx="576" cy="0" r="3"/><circle cx="672" cy="0" r="3"/><circle cx="768" cy="0" r="3"/><circle cx="864" cy="0" r="3"/><circle cx="960" cy="0" r="3"/><circle cx="1056" cy="0" r="3"/><circle cx="1152" cy="0" r="3"/><circle cx="1248" cy="0" r="3"/><circle cx="1344" cy="0" r="3"/><circle cx="1440" cy="0" r="3"/></g>
      <g transform="translate(0,384)"><circle cx="0" cy="0" r="3"/><circle cx="96" cy="0" r="3"/><circle cx="192" cy="0" r="3"/><circle cx="288" cy="0" r="3"/><circle cx="384" cy="0" r="3"/><circle cx="480" cy="0" r="3"/><circle cx="576" cy="0" r="3"/><circle cx="672" cy="0" r="3"/><circle cx="768" cy="0" r="3"/><circle cx="864" cy="0" r="3"/><circle cx="960" cy="0" r="3"/><circle cx="1056" cy="0" r="3"/><circle cx="1152" cy="0" r="3"/><circle cx="1248" cy="0" r="3"/><circle cx="1344" cy="0" r="3"/><circle cx="1440" cy="0" r="3"/></g>
      <g transform="translate(0,480)"><circle cx="0" cy="0" r="3"/><circle cx="96" cy="0" r="3"/><circle cx="192" cy="0" r="3"/><circle cx="288" cy="0" r="3"/><circle cx="384" cy="0" r="3"/><circle cx="480" cy="0" r="3"/><circle cx="576" cy="0" r="3"/><circle cx="672" cy="0" r="3"/><circle cx="768" cy="0" r="3"/><circle cx="864" cy="0" r="3"/><circle cx="960" cy="0" r="3"/><circle cx="1056" cy="0" r="3"/><circle cx="1152" cy="0" r="3"/><circle cx="1248" cy="0" r="3"/><circle cx="1344" cy="0" r="3"/><circle cx="1440" cy="0" r="3"/></g>
      <g transform="translate(0,576)"><circle cx="0" cy="0" r="3"/><circle cx="96" cy="0" r="3"/><circle cx="192" cy="0" r="3"/><circle cx="288" cy="0" r="3"/><circle cx="384" cy="0" r="3"/><circle cx="480" cy="0" r="3"/><circle cx="576" cy="0" r="3"/><circle cx="672" cy="0" r="3"/><circle cx="768" cy="0" r="3"/><circle cx="864" cy="0" r="3"/><circle cx="960" cy="0" r="3"/><circle cx="1056" cy="0" r="3"/><circle cx="1152" cy="0" r="3"/><circle cx="1248" cy="0" r="3"/><circle cx="1344" cy="0" r="3"/><circle cx="1440" cy="0" r="3"/></g>
      <g transform="translate(0,672)"><circle cx="0" cy="0" r="3"/><circle cx="96" cy="0" r="3"/><circle cx="192" cy="0" r="3"/><circle cx="288" cy="0" r="3"/><circle cx="384" cy="0" r="3"/><circle cx="480" cy="0" r="3"/><circle cx="576" cy="0" r="3"/><circle cx="672" cy="0" r="3"/><circle cx="768" cy="0" r="3"/><circle cx="864" cy="0" r="3"/><circle cx="960" cy="0" r="3"/><circle cx="1056" cy="0" r="3"/><circle cx="1152" cy="0" r="3"/><circle cx="1248" cy="0" r="3"/><circle cx="1344" cy="0" r="3"/><circle cx="1440" cy="0" r="3"/></g>
      <g transform="translate(0,768)"><circle cx="0" cy="0" r="3"/><circle cx="96" cy="0" r="3"/><circle cx="192" cy="0" r="3"/><circle cx="288" cy="0" r="3"/><circle cx="384" cy="0" r="3"/><circle cx="480" cy="0" r="3"/><circle cx="576" cy="0" r="3"/><circle cx="672" cy="0" r="3"/><circle cx="768" cy="0" r="3"/><circle cx="864" cy="0" r="3"/><circle cx="960" cy="0" r="3"/><circle cx="1056" cy="0" r="3"/><circle cx="1152" cy="0" r="3"/><circle cx="1248" cy="0" r="3"/><circle cx="1344" cy="0" r="3"/><circle cx="1440" cy="0" r="3"/></g>
    </g>
  </g>

  <!-- ── Sources: three systems that disagree ───────────────────────── -->
  <g filter="url(#dsoft)">
    <rect x="90" y="210" width="250" height="140" rx="20" fill="#ffffff"/>
    <rect x="90" y="420" width="250" height="140" rx="20" fill="#ffffff"/>
    <rect x="90" y="630" width="250" height="140" rx="20" fill="#ffffff"/>
  </g>

  <g transform="translate(90,210)">
    <rect x="34" y="34" width="86" height="14" rx="7" fill="#0b64f1" opacity="0.85"/>
    <rect x="34" y="70" width="150" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="34" y="96" width="112" height="12" rx="6" fill="#cbd5e1"/>
    <circle cx="206" cy="41" r="9" fill="#0b64f1"/>
  </g>
  <g transform="translate(90,420)">
    <rect x="34" y="34" width="104" height="14" rx="7" fill="#0b64f1" opacity="0.85"/>
    <rect x="34" y="70" width="128" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="34" y="96" width="160" height="12" rx="6" fill="#cbd5e1"/>
    <circle cx="206" cy="41" r="9" fill="#60a5fa"/>
  </g>
  <g transform="translate(90,630)">
    <rect x="34" y="34" width="74" height="14" rx="7" fill="#0b64f1" opacity="0.85"/>
    <rect x="34" y="70" width="146" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="34" y="96" width="98" height="12" rx="6" fill="#cbd5e1"/>
    <!-- this one is stale — the honest detail -->
    <circle cx="206" cy="41" r="9" fill="#f59e0b"/>
  </g>

  <!-- ── Pipelines converging on the warehouse ──────────────────────── -->
  <g stroke="#0b64f1" stroke-width="4" fill="none" opacity="0.45" stroke-linecap="round">
    <path d="M348 280 C 470 280, 470 460, 600 480" stroke-dasharray="12 14"/>
    <path d="M348 490 C 470 490, 470 495, 600 498" stroke-dasharray="12 14"/>
    <path d="M348 700 C 470 700, 470 540, 600 516" stroke-dasharray="12 14"/>
  </g>
  <!-- records in transit -->
  <g>
    <rect x="452" y="344" width="30" height="22" rx="5" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/>
    <rect x="452" y="482" width="30" height="22" rx="5" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/>
    <rect x="452" y="628" width="30" height="22" rx="5" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/>
  </g>

  <!-- ── Warehouse: one consistent store ────────────────────────────── -->
  <g>
    <ellipse cx="760" cy="500" rx="150" ry="150" fill="#0b64f1" opacity="0.10" filter="url(#dglow)"/>
  </g>
  <g filter="url(#dsoft)">
    <!-- three stacked layers -->
    <path d="M646 380 v90 c0 26 51 44 114 44 s114-18 114-44 v-90z" fill="#ffffff"/>
    <path d="M646 470 v90 c0 26 51 44 114 44 s114-18 114-44 v-90z" fill="#ffffff"/>
    <path d="M646 560 v90 c0 26 51 44 114 44 s114-18 114-44 v-90z" fill="url(#dcore)"/>
  </g>
  <g fill="none" stroke="#0b64f1" stroke-width="4">
    <ellipse cx="760" cy="380" rx="114" ry="44" fill="#ffffff"/>
    <path d="M646 380 v90 c0 26 51 44 114 44 s114-18 114-44 v-90"/>
    <ellipse cx="760" cy="470" rx="114" ry="44" opacity="0.55"/>
    <path d="M646 470 v90 c0 26 51 44 114 44 s114-18 114-44 v-90"/>
    <ellipse cx="760" cy="560" rx="114" ry="44" opacity="0.55"/>
    <path d="M646 560 v90 c0 26 51 44 114 44 s114-18 114-44 v-90"/>
  </g>
  <!-- fill level in the base layer -->
  <ellipse cx="760" cy="650" rx="94" ry="34" fill="#ffffff" opacity="0.28"/>
  <!-- a single agreed definition at the centre -->
  <g transform="translate(760,470)">
    <circle r="34" fill="#0b64f1"/>
    <path d="M-14 0 l10 10 l20 -22" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ── Output: one report everyone agrees on ──────────────────────── -->
  <g stroke="#0b64f1" stroke-width="4" fill="none" opacity="0.45" stroke-linecap="round">
    <path d="M900 470 C 990 470, 1000 400, 1090 396" stroke-dasharray="12 14"/>
    <path d="M900 520 C 990 520, 1000 640, 1090 646" stroke-dasharray="12 14"/>
  </g>

  <g filter="url(#dsoft)">
    <rect x="1100" y="250" width="340" height="290" rx="22" fill="#ffffff"/>
    <rect x="1100" y="580" width="340" height="180" rx="22" fill="#ffffff"/>
  </g>

  <!-- report: a chart built from the agreed figures -->
  <g transform="translate(1100,250)">
    <rect x="30" y="32" width="120" height="16" rx="8" fill="#0b64f1" opacity="0.85"/>
    <g>
      <rect x="34" y="176" width="42" height="56" rx="8" fill="#0b64f1" opacity="0.3"/>
      <rect x="92" y="140" width="42" height="92" rx="8" fill="#0b64f1" opacity="0.45"/>
      <rect x="150" y="188" width="42" height="44" rx="8" fill="#0b64f1" opacity="0.35"/>
      <rect x="208" y="108" width="42" height="124" rx="8" fill="#0b64f1" opacity="0.6"/>
      <rect x="266" y="80" width="42" height="152" rx="8" fill="#0b64f1"/>
    </g>
    <path d="M28 246 h284" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
    <path d="M55 150 L113 118 L171 138 L229 92 L287 66" fill="none" stroke="#0b64f1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <circle cx="287" cy="66" r="9" fill="#0b64f1"/>
  </g>

  <!-- data quality: freshness checks passing -->
  <g transform="translate(1100,580)">
    <rect x="30" y="30" width="140" height="14" rx="7" fill="#0b64f1" opacity="0.85"/>
    <g transform="translate(30,66)">
      <circle cx="13" cy="13" r="13" fill="#0b64f1" opacity="0.14"/>
      <path d="M7 13 l4 4 l9 -9" fill="none" stroke="#0b64f1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="44" y="6" width="180" height="14" rx="7" fill="#cbd5e1"/>
      <rect x="240" y="6" width="60" height="14" rx="7" fill="#0b64f1" opacity="0.45"/>
    </g>
    <g transform="translate(30,112)">
      <circle cx="13" cy="13" r="13" fill="#0b64f1" opacity="0.14"/>
      <path d="M7 13 l4 4 l9 -9" fill="none" stroke="#0b64f1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="44" y="6" width="148" height="14" rx="7" fill="#cbd5e1"/>
      <rect x="240" y="6" width="60" height="14" rx="7" fill="#0b64f1" opacity="0.45"/>
    </g>
  </g>
</svg>
